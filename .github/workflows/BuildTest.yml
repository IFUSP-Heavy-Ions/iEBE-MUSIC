name: Build Test

on:
  # Trigger the workflow on push or pull request,
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
      - dev
      - QGP-USP

jobs:
  build:
    # Pinned, not ubuntu-latest: this job compiles on the runner's own toolchain,
    # and "latest" moved to Ubuntu 26.04 (GCC 15, CMake 4.4, Boost 1.90) in
    # November 2026, which broke the TRENTo build on an unchanged tree.  The
    # container build (docker-publish.yml) is the test of what campaigns run;
    # this one only says the chain still compiles on a stock Ubuntu LTS.
    runs-on: ubuntu-24.04
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v2
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: Install dependent libraries
        # libboost-all-dev is required by the SMASH CMake build (Boost filesystem,
        # program_options and system). Both Dockerfiles install Boost already; only
        # this runner was missing it, which surfaced only once the build got past
        # the earlier MUSIC/Pythia8 failures.
        # python3-numpy and python3-scipy: since the PDG2021+ hadron list (5a970cd),
        # get_code_packages.sh builds iSS's hadron-gas table with
        # iSS_code/utilities/make_hrg_eos.py, which imports both. The runner's
        # system python3 has neither, so every push from 5a970cd on failed here
        # with "No module named 'numpy'" while the container build passed.
        run: |
           sudo apt-get update
           sudo apt-get install libfftw3-dev hdf5-tools libhdf5-dev libgsl-dev libeigen3-dev libboost-all-dev python3-numpy python3-scipy
      - name: Build the iEBE-MUSIC framework
        # get_code_packages.sh clones every code at a pinned commit and is what
        # both Dockerfiles run, so this test validates the build the container
        # actually performs.
        run: |
          cd codes/
          ./get_code_packages.sh
          ./compile_code_packages.sh
